#### general settings

name: train_LF-VSN_v2_4090_2day_scalable7
use_tb_logger: true
model: MIMO-VRN-h
distortion: sr
scale: 4
gpu_ids: [0]
gop: 3
num_video: 7
train_frame_offsets: [-1, 0, 1]
test_frame_offsets: [-1, 0, 1]
scalable_training: true
active_num_video_candidates: [1, 2, 3, 4, 5, 6, 7]
scalable_random_subset: true

#### datasets

datasets:
  train:
    name: Vimeo90K-FullTrain
    mode: train
    interval_list: [1]
    random_reverse: false
    border_mode: false
    data_path: vimeo90k/sequences
    txt_path: vimeo90k/sep_trainlist.txt
    num_video: 7

    N_frames: 7
    min_frames: 7
    use_shuffle: true
    n_workers: 10
    batch_size: 2
    GT_size: 128
    LQ_size: 36
    use_flip: true
    use_rot: true
    color: RGB
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

  val:
    num_video: 7
    name: Vimeo90K-T100
    mode: test
    data_path: vimeo90k/sequences
    txt_path: vimeo90k/sep_testlist_7video.txt

    N_frames: 1
    min_frames: 7
    max_items: 100
    n_workers: 2
    pin_memory: true
    persistent_workers: true
    padding: 'new_info'
    pred_interval: -1


#### network structures

network_G:
  which_model_G:
      subnet_type: DBNet
  in_nc: 12
  out_nc: 12
  block_num: [8, 8]
  scale: 2
  init: xavier_group
  block_num_rbm: 8
  clamp: 1.0


#### path

path:
  pretrain_model_G:
  models: ckp/base
  strict_load: true
  resume_state: ~


#### training settings

train:
  lr_G: !!float 1e-4
  beta1: 0.9
  beta2: 0.5
  niter: 120000
  warmup_iter: -1

  lr_scheme: MultiStepLR
  lr_steps: [20000, 40000, 70000, 90000, 110000]
  lr_gamma: 0.5

  pixel_criterion_forw: l2
  pixel_criterion_back: l1

  lambda_fit_forw: 64.
  lambda_rec_back: 1.
  lambda_secret_weight: 4.
  lambda_forward_weight: 1.
  lambda_host_weight: 1.
  lambda_center: 0.

  manual_seed: 10
  val_freq: !!float 1000
  weight_decay_G: !!float 1e-12
  gradient_clipping: 10
  use_amp: true
  allow_tf32: true


test:
  active_num_video: 7


#### logger

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
