# Runtime overrides, generated configs, results and logs are stored in a NEW suite directory.
name: rpm4090_nmse_v1
base_config: rpm_3060_nmse_10k.yaml
budget_hours: 28.0
profile_steps: 200
min_screen_steps: 20000
max_screen_steps: 50000
max_refine_steps: 150000
checkpoint_every: 1000
seed: 3407
repeat_seed: 7391
pair_seed: 20261029
monitor_pairs: 320
throughput_safety: 0.75
evaluation_reserve_hours: 3.0
fine_tune_learning_rate: 0.00003
selection:
  min_secret_gain_db: 0.5
  max_cover_loss_db: 0.5
  max_si_sdr_loss_db: 0.25
  max_clip_fraction: 0.0001
  max_pcm16_drop_db: 0.5
  min_oracle_snr_db: 60.0
  max_cycle_error: 0.005
arms:
  - name: a_nmse_control
    predictor:
      architecture: flat
      hidden_channels: 64
      num_blocks: 8
      kernel_size: 3
      dilations: [1, 1, 1, 1, 1, 1, 1, 1]
    latent_prediction: 0.0
  - name: b_flat_capacity
    predictor:
      architecture: flat
      # Within about 2% of the U-Net's TOTAL parameter count; not a width-only control.
      hidden_channels: 152
      num_blocks: 9
      kernel_size: 3
      dilations: [1, 1, 1, 1, 1, 1, 1, 1, 1]
    latent_prediction: 0.0
  - name: c_unet
    predictor:
      architecture: unet
      hidden_channels: 128
      num_blocks: 9
      kernel_size: 3
      dilations: [1, 2, 4, 2, 4, 8, 4, 8, 16]
    latent_prediction: 0.0
  - name: d_unet_latent
    predictor:
      architecture: unet
      hidden_channels: 128
      num_blocks: 9
      kernel_size: 3
      dilations: [1, 2, 4, 2, 4, 8, 4, 8, 16]
    latent_prediction: 0.05
