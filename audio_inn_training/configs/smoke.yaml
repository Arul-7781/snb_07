seed: 7
run_name: smoke

data:
  root: data/LibriSpeech
  train_split: train-clean-100
  val_split: dev-clean
  test_split: test-clean
  sample_rate: 16000
  segment_seconds: 1.0
  train_pairs_per_epoch: 32
  val_pairs: 16
  num_workers: 0

model:
  squeeze_factor: 8
  num_blocks: 2
  hidden_channels: 16
  clamp: 1.0

training:
  epochs: 1
  batch_size: 2
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  amp: false
  amp_dtype: bfloat16
  log_every_steps: 1
  validate_every_epochs: 1
  save_every_epochs: 1
  sample_every_epochs: 1
  resume: null

loss:
  stego_l1: 1.0
  stego_stft: 0.1
  secret_l1: 1.0
  secret_stft: 0.1
  latent_prior: 0.01

stft:
  fft_sizes: [256, 512]
  hop_factors: [4, 4]

output:
  root: runs
