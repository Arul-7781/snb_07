# LF-VSN-style redundancy prediction trial (audio-trial2).
# Identical to one_day_librispeech.yaml except that the decoder predicts the discarded
# residual from the stego instead of sampling Gaussian noise. Compare its validation
# curves against a one_day_librispeech run to measure the effect of the predictor.
experiment:
  name: rpm_wavinwav_clean_stable_one_day_librispeech
  seed: 3407
  output_dir: runs/rpm_wavinwav_clean_stable_one_day_librispeech

data:
  manifest: data/manifests/all.jsonl
  sample_rate: 16000
  channels: 1
  segment_seconds: 2.0
  train_split: train
  val_split: val
  min_rms: 0.003
  random_gain_db: 3.0
  num_workers: 6
  pin_memory: true

model:
  wavelet_levels: 3
  num_blocks: 8
  hidden_channels: 64
  subnet_layers: 4
  subnet_scales: 4
  clamp: 0.75
  kernel_size: 3
  latent_mode: predicted
  secret_decode_mode: predicted
  predictor:
    hidden_channels: 128
    num_blocks: 9
    kernel_size: 3
  secret_decoder:
    hidden_channels: 128
    num_blocks: 10
    kernel_size: 3

loss:
  stego_time: 2.0
  stego_stft: 1.0
  secret_time: 4.0
  secret_stft: 3.0
  recovered_cover: 0.25
  latent_prediction: 0.5
  # The predictor replaces the Gaussian stand-in, so the residual no longer needs to look
  # Gaussian. LF-VSN trains its predictor with no prior on the residual.
  latent_prior: 0.0
  scale_stability: 0.001
  stft_windows: [256, 512, 1024]

training:
  batch_size: 8
  accumulation_steps: 2
  max_steps: 200000
  max_hours: 24.0
  learning_rate: 0.00005
  predictor_learning_rate: 0.0001
  oracle_warmup_steps: 5000
  channel_augment_probability: 0.0
  channel_noise_std: 0.0
  channel_speckle_std: 0.0
  channel_resample_probability: 0.0
  channel_resample_min: 0.9
  channel_resample_max: 1.1
  amp_dtype: bfloat16
  max_nonfinite_batches: 5
  weight_decay: 0.000001
  grad_clip_norm: 2.0
  amp: true
  log_every: 25
  validate_every: 1000
  checkpoint_every: 5000
  validation_batches: 20
  keep_checkpoints: 3
  resume: null
