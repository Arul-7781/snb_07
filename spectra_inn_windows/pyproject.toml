[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-inn"
version = "0.1.0"
description = "Progressive reversible audio steganography research scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "einops>=0.8,<1",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.12,<2",
  "soundfile>=0.12,<1",
  "tensorboard>=2.16,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.9,<1",
]
metrics = [
  "pyloudnorm>=0.1.1,<1",
  "pystoi>=0.4,<1",
]

[project.scripts]
spectra-train = "spectra_inn.train:main"
spectra-build-manifest = "spectra_inn.data.manifest:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

